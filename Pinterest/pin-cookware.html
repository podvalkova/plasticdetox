<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>The 4 Safest Pans for Your Kitchen — Pinterest</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(../images/inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #d6d3d1; display: flex; justify-content: center; font-family: 'Inter', -apple-system, sans-serif; }
    .pin {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: #fafaf9;
    }
    .pin > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }
    .top-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 64px 50px 110px;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0.97) 0%,
        rgba(250, 250, 249, 0.90) 55%,
        rgba(250, 250, 249, 0) 100%
      );
      text-align: center;
    }
    .headline-tag {
      display: inline-block;
      font-size: 32px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #fff;
      background: #7c3aed;
      padding: 16px 36px;
      border-radius: 100px;
      margin-bottom: 28px;
    }
    .top-overlay h1 {
      font-size: 96px;
      font-weight: 900;
      color: #1c1917;
      line-height: 1.0;
      letter-spacing: -0.035em;
    }
    .top-overlay h1 .accent { color: #7c3aed; font-style: italic; }
    .badge {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #7c3aed;
      color: #fff;
      font-size: 72px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 6px 28px rgba(124, 58, 237, 0.55),
        0 0 0 6px rgba(255, 255, 255, 0.95);
      z-index: 3;
    }
    .b1 { left: 227px; top: 348px; }
    .b2 { left: 730px; top: 348px; }
    .b3 { left: 297px; top: 1048px; }
    .b4 { left: 730px; top: 1112px; }
    .footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 48px;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0) 0%,
        rgba(250, 250, 249, 0.92) 55%,
        rgba(250, 250, 249, 1) 100%
      );
    }
    .footer-stat { font-size: 32px; font-weight: 700; color: #44403c; }
    .footer-url { font-size: 32px; font-weight: 900; color: #7c3aed; }
  </style>
</head>
<body>
  <div class="pin">
    <img src="pin-cookware.png" alt="Pencil sketch of four safe cookware pans on marble: cast iron, stainless steel, carbon steel, glass">
    <div class="top-overlay">
      <div class="headline-tag">Cookware Guide</div>
      <h1>The 4 <span class="accent">Safest</span> Pans<br>for Your Kitchen</h1>
    </div>
    <div class="badge b1">1</div>
    <div class="badge b2">2</div>
    <div class="badge b3">3</div>
    <div class="badge b4">4</div>
    <div class="footer">
      <span class="footer-stat">No PFAS, no nonstick</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body>
</html>

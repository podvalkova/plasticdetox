<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>The 4 Safest Pans for Your Kitchen — Pinterest</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(../images/inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #d6d3d1; display: flex; justify-content: center; padding: 2rem; font-family: 'Inter', -apple-system, sans-serif; }
    .pin {
      width: 1080px;
      height: 1620px;
      position: relative;
      overflow: hidden;
      background: #fafaf9;
    }
    .pin > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .top-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 110px 50px 110px;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0.97) 0%,
        rgba(250, 250, 249, 0.90) 55%,
        rgba(250, 250, 249, 0) 100%
      );
      text-align: center;
    }
    .headline-tag {
      display: inline-block;
      font-size: 32px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #fff;
      background: #7c3aed;
      padding: 16px 36px;
      border-radius: 100px;
      margin-bottom: 28px;
    }
    .top-overlay h1 {
      font-size: 96px;
      font-weight: 900;
      color: #1c1917;
      line-height: 1.0;
      letter-spacing: -0.035em;
    }
    .top-overlay h1 .accent { color: #7c3aed; font-style: italic; }
    .badge {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #7c3aed;
      color: #fff;
      font-size: 36px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 4px 18px rgba(124, 58, 237, 0.5),
        0 0 0 5px rgba(255, 255, 255, 0.95);
      z-index: 3;
    }
    .b1 { left: 262px; top: 427px; }
    .b2 { left: 743px; top: 433px; }
    .b3 { left: 333px; top: 1055px; }
    .b4 { left: 750px; top: 1093px; }
    .bottom-card {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0) 0%,
        rgba(250, 250, 249, 0.9) 15%,
        rgba(250, 250, 249, 0.97) 30%,
        rgba(250, 250, 249, 1) 50%
      );
      padding: 110px 48px 28px;
    }
    .swaps {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 32px;
    }
    .swap {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #fff;
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .swap-num {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 50%;
      background: #7c3aed;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .swap-text {
      flex: 1;
      font-size: 22px;
      font-weight: 700;
      color: #1c1917;
      line-height: 1.25;
    }
    .swap-text span {
      display: block;
      font-size: 17px;
      font-weight: 500;
      color: #78716c;
      margin-top: 2px;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e7e5e4;
    }
    .footer-stat { font-size: 18px; font-weight: 600; color: #78716c; }
    .footer-url { font-size: 22px; font-weight: 800; color: #7c3aed; }
  </style>
</head>
<body>
  <div class="pin">
    <img src="pin-cookware-src.png" alt="Pencil sketch of four safe cookware pans on marble: cast iron, stainless steel, carbon steel, glass">
    <div class="top-overlay">
      <div class="headline-tag">Cookware Guide</div>
      <h1>The 4 <span class="accent">Safest</span> Pans<br>for Your Kitchen</h1>
    </div>
    <div class="badge b1">1</div>
    <div class="badge b2">2</div>
    <div class="badge b3">3</div>
    <div class="badge b4">4</div>
    <div class="bottom-card">
      <div class="swaps">
        <div class="swap">
          <div class="swap-num">1</div>
          <div class="swap-text">Cast Iron<span>Best for searing</span></div>
        </div>
        <div class="swap">
          <div class="swap-num">2</div>
          <div class="swap-text">Stainless Steel<span>Best everyday</span></div>
        </div>
        <div class="swap">
          <div class="swap-num">3</div>
          <div class="swap-text">Carbon Steel<span>High heat</span></div>
        </div>
        <div class="swap">
          <div class="swap-num">4</div>
          <div class="swap-text">Pure Ceramic<span>Zero leaching</span></div>
        </div>
      </div>
      <div class="footer">
        <span class="footer-stat">No PFAS, no nonstick</span>
        <span class="footer-url">plasticdetox.org</span>
      </div>
    </div>
  </div>
</body>
</html>

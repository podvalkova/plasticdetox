<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Plastic Free Swimwear Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #d6d3d1; display: flex; justify-content: center; padding: 2rem; font-family: 'Inter', -apple-system, sans-serif; }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      background: #fbfcf6;
      display: flex;
      align-items: center;
    }
    .text {
      flex: 1;
      padding: 0 56px 0 72px;
    }
    .headline-tag {
      display: inline-block;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #fff;
      background: #7c3aed;
      padding: 12px 28px;
      border-radius: 100px;
      margin-bottom: 26px;
    }
    .text h1 {
      font-size: 76px;
      font-weight: 900;
      color: #1c1917;
      line-height: 0.98;
      letter-spacing: -0.04em;
    }
    .text h1 .accent { color: #7c3aed; font-style: italic; }
    .text .sub {
      margin-top: 24px;
      font-size: 28px;
      font-weight: 700;
      color: #44403c;
    }
    .text .url {
      margin-top: 30px;
      font-size: 26px;
      font-weight: 900;
      color: #7c3aed;
    }
    .art {
      width: 420px;
      height: 630px;
      flex: 0 0 420px;
      position: relative;
    }
    .art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .art::before {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 120px;
      background: linear-gradient(to right, #fbfcf6 0%, rgba(251,252,246,0) 100%);
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="text">
      <div class="headline-tag">2026 Buying Guide</div>
      <h1>Plastic Free<br>Swimwear,<br><span class="accent">Honestly Ranked</span></h1>
      <div class="sub">Ranked by actual plastic content, not marketing</div>
      <div class="url">plasticdetox.org</div>
    </div>
    <div class="art">
      <img src="plastic-free-swimwear.png" alt="Black and white pencil illustration of a bikini and board shorts">
    </div>
  </div>
</body>
</html>

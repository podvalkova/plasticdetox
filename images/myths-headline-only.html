<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Low Tox Myths, Debunked — Headline Only</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fafaf9;
      display: flex;
      justify-content: center;
      padding: 2rem;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .pin {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
    }

    .pin > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .top-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 44px 40px 80px;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0.95) 0%,
        rgba(250, 250, 249, 0.85) 60%,
        rgba(250, 250, 249, 0) 100%
      );
      text-align: center;
    }

    .headline-tag {
      display: inline-block;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #7c3aed;
      background: #ede9fe;
      padding: 8px 22px;
      border-radius: 100px;
      margin-bottom: 16px;
    }

    .top-overlay h1 {
      font-size: 52px;
      font-weight: 900;
      color: #1c1917;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 44px;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0) 0%,
        rgba(250, 250, 249, 0.9) 40%,
        rgba(250, 250, 249, 1) 100%
      );
    }

    .footer-stat {
      font-size: 15px;
      font-weight: 600;
      color: #78716c;
    }

    .footer-url {
      font-size: 17px;
      font-weight: 800;
      color: #7c3aed;
    }
  </style>
</head>
<body>
  <div class="pin">
    <img src="myth.png" alt="Kitchen countertop with low tox essentials">

    <div class="top-overlay">
      <div class="headline-tag">Myth Busting</div>
      <h1>Low Tox Myths,<br>Debunked</h1>
    </div>

    <div class="footer">
      <span class="footer-stat">27 claims ranked by actual evidence</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body>
</html>

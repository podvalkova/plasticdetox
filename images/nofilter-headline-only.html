<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>No Filter Talk — Headline</title>
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('inter-latin.woff2') format('woff2');
      font-weight: 100 900;
      font-display: block;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fafaf9;
      display: flex;
      justify-content: center;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .pin {
      width: 768px;
      height: 1376px;
      position: relative;
      overflow: hidden;
    }

    .pin > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .top-overlay {
      position: absolute;
      top: 20%; left: 0; right: 0;
      padding: 44px 40px 80px;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0.95) 0%,
        rgba(250, 250, 249, 0.85) 60%,
        rgba(250, 250, 249, 0) 100%
      );
      text-align: center;
    }

    .top-overlay h1 {
      font-size: 72px;
      font-weight: 900;
      color: #7c3aed;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }
  </style>
</head>
<body>
  <div class="pin">
    <img src="no filter.png" alt="Two coffee mugs sketch">

    <div class="top-overlay">
      <h1>No Filter Talk</h1>
    </div>
  </div>
</body>
</html>

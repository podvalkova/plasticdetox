<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Headlines vs exposure: know the difference</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #d6d3d1;
      display: flex;
      justify-content: center;
      padding: 2rem;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .pin {
      width: 1080px;
      height: 1920px;
      background: #ede9fe;
      display: flex;
      flex-direction: column;
      padding: 70px 64px 60px;
      position: relative;
      overflow: hidden;
    }

    .pin::before {
      content: "";
      position: absolute;
      top: -200px;
      right: -200px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 181, 253, 0.6) 0%, rgba(237, 233, 254, 0) 70%);
      pointer-events: none;
    }

    .pin::after {
      content: "";
      position: absolute;
      bottom: -250px;
      left: -250px;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 181, 253, 0.5) 0%, rgba(237, 233, 254, 0) 70%);
      pointer-events: none;
    }

    .frame-label {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.32em;
      color: #7c3aed;
      text-transform: uppercase;
      z-index: 5;
      margin-bottom: 36px;
      position: relative;
    }

    .header {
      text-align: center;
      position: relative;
      z-index: 2;
      margin-bottom: 56px;
    }

    .tag {
      display: inline-block;
      font-size: 32px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #ffffff;
      background: #1c1917;
      padding: 14px 36px;
      border-radius: 100px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 96px;
      font-weight: 900;
      color: #1c1917;
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    h1 .accent {
      color: #7c3aed;
      font-style: italic;
    }

    .compare {
      display: flex;
      flex-direction: column;
      gap: 32px;
      position: relative;
      z-index: 2;
      margin-bottom: 56px;
    }

    .row {
      background: #ffffff;
      border-radius: 28px;
      padding: 44px 48px;
      box-shadow: 0 10px 30px rgba(76, 29, 149, 0.12);
      border-left: 16px solid;
    }

    .row.faded { border-color: #a8a29e; opacity: 0.92; }
    .row.real { border-color: #7c3aed; }

    .row-label {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .row.faded .row-label { color: #78716c; }
    .row.real .row-label { color: #7c3aed; }

    .row-text {
      font-size: 60px;
      font-weight: 900;
      color: #1c1917;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }

    .row.faded .row-text {
      color: #57534e;
      text-decoration: line-through;
      text-decoration-thickness: 6px;
      text-decoration-color: rgba(168, 162, 158, 0.7);
    }

    .verdict {
      background: #1c1917;
      color: #fafaf9;
      border-radius: 32px;
      padding: 50px 48px;
      text-align: center;
      position: relative;
      z-index: 2;
      box-shadow: 0 16px 48px rgba(28, 25, 23, 0.28);
      margin-bottom: 36px;
    }

    .verdict-label {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: #c4b5fd;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .verdict-text {
      font-size: 86px;
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.0;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: auto;
      padding-top: 28px;
      border-top: 2px solid rgba(124, 58, 237, 0.25);
      position: relative;
      z-index: 2;
    }

    .footer-stat {
      font-size: 32px;
      font-weight: 700;
      color: #57534e;
    }

    .footer-url {
      font-size: 36px;
      font-weight: 900;
      color: #7c3aed;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="pin">
    <div class="frame-label">5 of 6</div>

    <div class="header">
      <div class="tag">The takeaway</div>
      <h1>Where the<br><span class="accent">plastic</span> really is</h1>
    </div>

    <div class="compare">
      <div class="row faded">
        <div class="row-label">Get the headlines</div>
        <div class="row-text">Honey and salt.</div>
      </div>
      <div class="row real">
        <div class="row-label">Get the exposure</div>
        <div class="row-text">Bottled water and tea bags.</div>
      </div>
    </div>

    <div class="verdict">
      <div class="verdict-label">Bottom line</div>
      <div class="verdict-text">Know the<br>difference.</div>
    </div>

    <div class="footer">
      <span class="footer-stat">Read the full guide</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body>
</html>

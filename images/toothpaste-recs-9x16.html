<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Plastic Free Toothpastes We Recommend</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #d6d3d1;
      display: flex;
      justify-content: center;
      padding: 2rem;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .pin {
      width: 1080px;
      height: 1920px;
      background: #ede9fe;
      display: flex;
      flex-direction: column;
      padding: 70px 60px 50px;
      position: relative;
      overflow: hidden;
    }

    .pin::before {
      content: "";
      position: absolute;
      top: -200px;
      right: -200px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 181, 253, 0.6) 0%, rgba(237, 233, 254, 0) 70%);
      pointer-events: none;
    }

    .pin::after {
      content: "";
      position: absolute;
      bottom: -250px;
      left: -250px;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 181, 253, 0.5) 0%, rgba(237, 233, 254, 0) 70%);
      pointer-events: none;
    }

    .header {
      text-align: center;
      position: relative;
      z-index: 2;
      margin-bottom: 38px;
    }

    .tag {
      display: inline-block;
      font-size: 32px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #ffffff;
      background: #7c3aed;
      padding: 14px 36px;
      border-radius: 100px;
      margin-bottom: 26px;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.3);
    }

    h1 {
      font-size: 92px;
      font-weight: 900;
      color: #1c1917;
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    h1 .accent {
      color: #7c3aed;
      font-style: italic;
    }

    .subhead {
      margin-top: 18px;
      font-size: 32px;
      font-weight: 600;
      color: #57534e;
      line-height: 1.3;
    }

    .cards {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
      position: relative;
      z-index: 2;
    }

    .card {
      flex: 1;
      background: #ffffff;
      border-radius: 28px;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      gap: 28px;
      box-shadow: 0 8px 28px rgba(76, 29, 149, 0.12);
      position: relative;
    }

    .product-img {
      width: 220px;
      height: 220px;
      min-width: 220px;
      background: #fafaf9;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 12px;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .best-for {
      display: inline-block;
      align-self: flex-start;
      font-size: 32px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #7c3aed;
      background: #ede9fe;
      padding: 8px 18px;
      border-radius: 100px;
      margin-bottom: 4px;
    }

    .product-name {
      font-size: 44px;
      font-weight: 900;
      color: #1c1917;
      letter-spacing: -0.025em;
      line-height: 1.05;
    }

    .product-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .price {
      font-size: 32px;
      font-weight: 900;
      color: #16a34a;
      letter-spacing: 0.04em;
    }

    .feature {
      font-size: 32px;
      font-weight: 700;
      color: #44403c;
      line-height: 1.25;
    }

    .feature::before {
      content: "·";
      margin-right: 14px;
      color: #a8a29e;
      font-weight: 900;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px solid rgba(124, 58, 237, 0.25);
      position: relative;
      z-index: 2;
    }

    .footer-stat {
      font-size: 32px;
      font-weight: 700;
      color: #57534e;
    }

    .footer-url {
      font-size: 36px;
      font-weight: 900;
      color: #7c3aed;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="pin">
    <div class="header">
      <div class="tag">We Recommend</div>
      <h1>Plastic Free<br><span class="accent">Toothpastes</span></h1>
      <p class="subhead">Hydroxyapatite formulas in zero plastic packaging</p>
    </div>

    <div class="cards">
      <div class="card">
        <div class="product-img"><img src="_tmp-nobs.jpg" alt="NOBS"></div>
        <div class="card-body">
          <div class="best-for">Best Overall</div>
          <div class="product-name">NOBS Tablets</div>
          <div class="product-meta">
            <span class="price">$$$</span>
            <span class="feature">Glass jar, zero plastic</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="product-img"><img src="_tmp-davids.webp" alt="Davids Hydroxi"></div>
        <div class="card-body">
          <div class="best-for">Best Tube</div>
          <div class="product-name">Davids Hydroxi</div>
          <div class="product-meta">
            <span class="price">$$</span>
            <span class="feature">Recyclable metal tube</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="product-img"><img src="_tmp-risewell.png" alt="RiseWell"></div>
        <div class="card-body">
          <div class="best-for">Best for Kids</div>
          <div class="product-name">RiseWell Mineral</div>
          <div class="product-meta">
            <span class="price">$$$</span>
            <span class="feature">Safe to swallow, BPA free</span>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="footer-stat">Shop the full list</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body>
</html>

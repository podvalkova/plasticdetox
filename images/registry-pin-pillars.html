<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>6 Pillars of a Non Toxic Baby Registry — Pinterest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #d6d3d1;
      display: flex;
      justify-content: center;
      padding: 2rem;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .pin {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
    }

    .pin > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .top-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 44px 40px 80px;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0.95) 0%,
        rgba(250, 250, 249, 0.85) 60%,
        rgba(250, 250, 249, 0) 100%
      );
      text-align: center;
    }

    .headline-tag {
      display: inline-block;
      font-size: 32px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #fff;
      background: #7c3aed;
      padding: 14px 32px;
      border-radius: 100px;
      margin-bottom: 22px;
    }

    .top-overlay h1 {
      font-size: 88px;
      font-weight: 900;
      color: #1c1917;
      line-height: 1.04;
      letter-spacing: -0.03em;
    }

    .top-overlay h1 .accent { color: #7c3aed; font-style: italic; }

    .badge {
      position: absolute;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #7c3aed;
      color: #fff;
      font-size: 44px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 4px 16px rgba(124, 58, 237, 0.5),
        0 0 0 6px rgba(255, 255, 255, 0.95);
      z-index: 3;
    }

    .badge-1 { left: 8%; top: 38%; }
    .badge-2 { left: 38%; top: 33%; }
    .badge-3 { left: 70%; top: 38%; }
    .badge-4 { left: 12%; top: 62%; }
    .badge-5 { left: 46%; top: 58%; }
    .badge-6 { left: 75%; top: 64%; }

    .footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 48px;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0) 0%,
        rgba(250, 250, 249, 0.92) 55%,
        rgba(250, 250, 249, 1) 100%
      );
    }

    .footer-stat {
      font-size: 32px;
      font-weight: 700;
      color: #44403c;
    }

    .footer-url {
      font-size: 32px;
      font-weight: 900;
      color: #7c3aed;
    }
  </style>
</head>
<body>
  <div class="pin">
    <img src="registry.png" alt="Pencil sketch of a non toxic nursery">

    <div class="top-overlay">
      <div class="headline-tag">Baby Registry</div>
      <h1>6 Pillars of a<br>Non Toxic <span class="accent">Baby Registry</span></h1>
    </div>

    <div class="badge badge-1">1</div>
    <div class="badge badge-2">2</div>
    <div class="badge badge-3">3</div>
    <div class="badge badge-4">4</div>
    <div class="badge badge-5">5</div>
    <div class="badge badge-6">6</div>

    <div class="footer">
      <span class="footer-stat">141 vetted picks</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>BPA Free: Rating</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #d6d3d1;
      display: flex;
      justify-content: center;
      padding: 2rem;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .pin {
      width: 1080px;
      height: 1920px;
      background: #ede9fe;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 70px;
      position: relative;
      overflow: hidden;
    }

    .pin::before {
      content: "";
      position: absolute;
      top: -200px;
      right: -200px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 181, 253, 0.6) 0%, rgba(237, 233, 254, 0) 70%);
      pointer-events: none;
    }

    .pin::after {
      content: "";
      position: absolute;
      bottom: -250px;
      left: -250px;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 181, 253, 0.5) 0%, rgba(237, 233, 254, 0) 70%);
      pointer-events: none;
    }

    .frame-label {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.32em;
      color: #7c3aed;
      text-transform: uppercase;
      z-index: 5;
    }

    .tag {
      display: inline-block;
      font-size: 32px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #ffffff;
      background: #7c3aed;
      padding: 16px 40px;
      border-radius: 100px;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.35);
    }

    .score-block {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .score {
      font-size: 600px;
      font-weight: 900;
      color: #7c3aed;
      line-height: 0.85;
      letter-spacing: -0.08em;
      text-shadow: 0 12px 40px rgba(124, 58, 237, 0.25);
    }

    .out-of {
      font-size: 80px;
      font-weight: 900;
      color: #1c1917;
      letter-spacing: -0.04em;
      margin-top: 8px;
    }

    .verdict {
      margin-top: 56px;
      font-size: 72px;
      font-weight: 900;
      color: #1c1917;
      letter-spacing: -0.03em;
      line-height: 1.05;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .verdict .accent {
      color: #7c3aed;
      font-style: italic;
    }

    .subline {
      margin-top: 32px;
      font-size: 36px;
      font-weight: 600;
      color: #44403c;
      line-height: 1.3;
      max-width: 880px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .footer {
      position: absolute;
      bottom: 70px;
      left: 70px;
      right: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 28px;
      border-top: 2px solid rgba(124, 58, 237, 0.25);
      z-index: 2;
    }

    .footer-stat {
      font-size: 32px;
      font-weight: 700;
      color: #57534e;
    }

    .footer-url {
      font-size: 36px;
      font-weight: 900;
      color: #7c3aed;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="pin">
    <div class="frame-label">3 of 3</div>

    <div class="tag">Trust Score</div>

    <div class="score-block">
      <div class="score">1</div>
      <div class="out-of">out of 10</div>
    </div>

    <div class="verdict"><span class="accent">Marketing,</span><br>not safety.</div>

    <p class="subline">BPA free swaps one bisphenol for another. If you can, choose glass or stainless steel.</p>

    <div class="footer">
      <span class="footer-stat">Read the full guide</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body>
</html>

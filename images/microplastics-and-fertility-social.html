<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Microplastics and Fertility Social</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fafaf9; display: flex; justify-content: center; font-family: 'Inter', -apple-system, sans-serif; }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      background: #fafaf9;
      display: flex;
      align-items: center;
    }
    .card > img.bg {
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      width: 560px;
      height: 760px;
      object-fit: cover;
      object-position: center 38%;
      display: block;
    }
    .left {
      position: relative;
      z-index: 2;
      padding: 0 60px;
      max-width: 720px;
    }
    .tag {
      display: inline-block;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #fff;
      background: #7c3aed;
      padding: 12px 26px;
      border-radius: 100px;
      margin-bottom: 26px;
    }
    h1 {
      font-size: 70px;
      font-weight: 900;
      color: #1c1917;
      line-height: 1.02;
      letter-spacing: -0.035em;
    }
    h1 .accent { color: #7c3aed; font-style: italic; }
    .sub {
      margin-top: 24px;
      font-size: 26px;
      font-weight: 600;
      color: #57534e;
      max-width: 600px;
      line-height: 1.3;
    }
    .url { margin-top: 30px; font-size: 26px; font-weight: 900; color: #7c3aed; }
    .fade {
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 820px;
      background: linear-gradient(to right, #fafaf9 58%, rgba(250,250,249,0) 100%);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="bg" src="microplastics-and-fertility-bg.webp" alt="Pencil sketch of a low tox kitchen with a wood cutting board of vegetables, a glass bottle, and a stainless steel pan">
    <div class="fade"></div>
    <div class="left">
      <div class="tag">The Research</div>
      <h1>Are <span class="accent">Microplastics</span> Affecting Your Fertility?</h1>
      <p class="sub">What the 2024 to 2026 studies actually show, and the swaps that matter for couples trying to conceive.</p>
      <div class="url">plasticdetox.org</div>
    </div>
  </div>
</body>
</html>

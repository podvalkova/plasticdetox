<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Best Non Toxic Period Products Article Hero</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #d6d3d1; display: flex; justify-content: center; padding: 2rem; font-family: 'Inter', -apple-system, sans-serif; }
    .pin {
      width: 848px;
      height: 1264px;
      position: relative;
      overflow: hidden;
      background: #f2efe9;
    }
    .pin > svg.scene {
      width: 100%;
      height: 100%;
      display: block;
    }
    .top-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 52px 44px 96px;
      background: linear-gradient(to bottom,
        rgba(244, 241, 235, 0.97) 0%,
        rgba(244, 241, 235, 0.88) 52%,
        rgba(244, 241, 235, 0) 100%
      );
      text-align: center;
    }
    .headline-tag {
      display: inline-block;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #fff;
      background: #7c3aed;
      padding: 12px 28px;
      border-radius: 100px;
      margin-bottom: 22px;
    }
    .top-overlay h1 {
      font-size: 78px;
      font-weight: 900;
      color: #1c1917;
      line-height: 0.98;
      letter-spacing: -0.04em;
    }
    .top-overlay h1 .accent { color: #7c3aed; font-style: italic; }
    .footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 40px;
      background: linear-gradient(to bottom,
        rgba(244, 241, 235, 0) 0%,
        rgba(244, 241, 235, 0.85) 55%,
        rgba(244, 241, 235, 0.97) 100%
      );
    }
    .footer-stat { font-size: 26px; font-weight: 700; color: #57534e; }
    .footer-url { font-size: 28px; font-weight: 900; color: #7c3aed; }
  </style>
</head>
<body>
  <div class="pin">
    <svg class="scene" viewBox="0 0 848 1264" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pencil sketch illustration of non toxic period products: a medical grade silicone menstrual cup, a menstrual disc, an organic cotton tampon with a cardboard applicator, and a folded cotton cloth pad">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f6f3ee"/>
          <stop offset="55%" stop-color="#efe9e0"/>
          <stop offset="100%" stop-color="#e7ded2"/>
        </linearGradient>
        <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e3dacd"/>
          <stop offset="100%" stop-color="#d9cdbc"/>
        </linearGradient>
      </defs>

      <rect x="0" y="0" width="848" height="1264" fill="url(#bg)"/>

      <!-- soft botanical arcs -->
      <g stroke="#c9bfae" stroke-width="3" fill="none" opacity="0.5">
        <path d="M-40 430 C 180 366, 300 520, 520 442 S 860 384, 900 462"/>
        <path d="M-40 1216 C 200 1160, 340 1272, 560 1200 S 880 1168, 900 1232"/>
      </g>
      <g fill="#e5d9f2" opacity="0.7">
        <circle cx="742" cy="470" r="104"/>
        <circle cx="96" cy="640" r="58"/>
      </g>

      <g transform="translate(424 1264) scale(1.1) translate(-424 -1264)">
      <!-- CARTON OF ORGANIC COTTON TAMPONS, behind -->
      <g transform="translate(430 1120)" stroke="#57534e" stroke-width="7" fill="#f4ece0" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-212 0 L -212 -488 L 148 -488 L 148 0 Z"/>
        <path d="M148 0 L 148 -488 L 226 -546 L 226 -58 Z" fill="#eadfcd"/>
        <path d="M-212 -488 L -134 -546 L 226 -546 L 148 -488 Z" fill="#faf5ec"/>
        <path d="M-212 -392 L 148 -392" stroke="#c4b5fd" stroke-width="8"/>
        <path d="M-212 -370 L 148 -370" stroke="#ddd3c2" stroke-width="5"/>
        <g stroke="#b7ab99" stroke-width="6">
          <path d="M-170 -300 L 40 -300"/>
          <path d="M-170 -258 L 106 -258"/>
          <path d="M-170 -216 L -20 -216"/>
        </g>
      </g>

      <!-- shelf -->
      <rect x="48" y="1120" width="752" height="18" rx="9" fill="url(#shelf)"/>

      <!-- FOLDED COTTON CLOTH PAD, front left -->
      <g transform="translate(146 1120)" stroke="#57534e" stroke-width="7" fill="#f7f4ee" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-108 0 L -108 -152 C -108 -186, -84 -204, 0 -204 C 84 -204, 108 -186, 108 -152 L 108 0 Z"/>
        <path d="M-108 -152 C -108 -118, -84 -102, 0 -102 C 84 -102, 108 -118, 108 -152" fill="none" stroke="#d6d3d1" stroke-width="5"/>
        <path d="M-108 -60 L 108 -60" stroke="#d6d3d1" stroke-width="5"/>
      </g>

      <!-- MENSTRUAL CUP -->
      <g transform="translate(348 700)" stroke="#57534e" stroke-width="7" fill="#efe6f7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-104 0 C -104 -28, -76 -42, 0 -42 C 76 -42, 104 -28, 104 0 L 66 288 C 60 336, 36 358, 0 358 C -36 358, -60 336, -66 288 Z"/>
        <ellipse cx="0" cy="-2" rx="104" ry="32" fill="#f9f6fd"/>
        <path d="M0 358 L 0 420" stroke-width="13"/>
        <path d="M-80 140 L 80 140" stroke="#c4b5fd" stroke-width="6"/>
      </g>

      <!-- MENSTRUAL DISC, front centre -->
      <g transform="translate(576 1010)" stroke="#57534e" stroke-width="7" fill="#efe6f7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-158 -8 C -158 -78, -82 -116, 0 -116 C 82 -116, 158 -78, 158 -8 C 158 66, 82 110, 0 110 C -82 110, -158 66, -158 -8 Z"/>
        <ellipse cx="0" cy="-8" rx="158" ry="62" fill="#f9f6fd"/>
        <path d="M-62 -12 C -32 16, 32 16, 62 -12" stroke="#c4b5fd" stroke-width="6" fill="none"/>
      </g>

      <!-- TAMPON WITH CARDBOARD APPLICATOR, right -->
      <g transform="translate(752 630)" stroke="#57534e" stroke-width="7" fill="#f6efe2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-48 0 C -48 -34, 48 -34, 48 0 L 48 424 C 48 460, -48 460, -48 424 Z"/>
        <ellipse cx="0" cy="0" rx="48" ry="22" fill="#fbf6ec"/>
        <path d="M-48 172 L 48 172" stroke="#a8a29e" stroke-width="5"/>
        <path d="M0 460 L 0 490" stroke-width="11"/>
      </g>

      <!-- pencil texture strokes on the shelf -->
      <g stroke="#b9ad9b" stroke-width="2.5" opacity="0.45" stroke-linecap="round">
        <path d="M84 1162 L 250 1162"/>
        <path d="M112 1184 L 214 1184"/>
        <path d="M620 1162 L 782 1162"/>
      </g>
      </g>
    </svg>
    <div class="top-overlay">
      <div class="headline-tag">Personal Care</div>
      <h1>Best <span class="accent">Non&nbsp;Toxic</span><br>Period Products</h1>
    </div>
    <div class="footer">
      <div class="footer-stat">Silicone · Organic Cotton</div>
      <div class="footer-url">plasticdetox.org</div>
    </div>
  </div>
</body>
</html>

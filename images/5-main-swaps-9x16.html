<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>5 Main Swaps to Start With</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #d6d3d1;
      display: flex;
      justify-content: center;
      padding: 2rem;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .pin {
      width: 1080px;
      height: 1920px;
      background: #ede9fe;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 70px;
      position: relative;
      overflow: hidden;
    }

    .pin::before {
      content: "";
      position: absolute;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 181, 253, 0.55) 0%, rgba(237, 233, 254, 0) 70%);
      pointer-events: none;
    }

    .pin::after {
      content: "";
      position: absolute;
      bottom: -250px;
      left: -250px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 181, 253, 0.45) 0%, rgba(237, 233, 254, 0) 70%);
      pointer-events: none;
    }

    .header {
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .headline-tag {
      display: inline-block;
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #ffffff;
      background: #7c3aed;
      padding: 12px 32px;
      border-radius: 100px;
      margin-bottom: 36px;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.3);
    }

    h1 {
      font-size: 116px;
      font-weight: 900;
      color: #1c1917;
      line-height: 0.98;
      letter-spacing: -0.045em;
      margin-bottom: 28px;
    }

    h1 .accent {
      color: #7c3aed;
      font-style: italic;
    }

    .subhead {
      font-size: 32px;
      font-weight: 500;
      color: #57534e;
      line-height: 1.3;
      max-width: 820px;
      margin: 0 auto;
    }

    .swaps {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
      position: relative;
      z-index: 2;
    }

    .swap {
      display: flex;
      align-items: center;
      gap: 28px;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px 36px;
      box-shadow: 0 6px 24px rgba(76, 29, 149, 0.10);
    }

    .swap-num {
      width: 76px;
      height: 76px;
      min-width: 76px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #7c3aed;
      color: #fff;
      font-size: 38px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
    }

    .swap-text {
      flex: 1;
    }

    .swap-title {
      font-size: 38px;
      font-weight: 800;
      color: #1c1917;
      line-height: 1.15;
      letter-spacing: -0.015em;
      margin-bottom: 6px;
    }

    .swap-sub {
      font-size: 22px;
      font-weight: 500;
      color: #78716c;
      line-height: 1.3;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 40px;
      padding-top: 28px;
      border-top: 2px solid rgba(124, 58, 237, 0.2);
      position: relative;
      z-index: 2;
    }

    .footer-stat {
      font-size: 26px;
      font-weight: 600;
      color: #57534e;
    }

    .footer-url {
      font-size: 30px;
      font-weight: 900;
      color: #7c3aed;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="pin">
    <div class="header">
      <div class="headline-tag">Start Here</div>
      <h1>5 Main Swaps<br>to <span class="accent">Start</span> With</h1>
      <p class="subhead">The highest impact changes to reduce your plastic exposure at home</p>
    </div>
  </div>
</body>
</html>

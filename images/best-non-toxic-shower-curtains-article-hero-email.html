<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Non Toxic Shower Curtains — Email Hero</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #d6d3d1; display: flex; justify-content: center; padding: 2rem; font-family: 'Inter', -apple-system, sans-serif; }
    .pin {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: #f2efe9;
    }
    .pin > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .top-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 56px 48px 100px;
      background: linear-gradient(to bottom,
        rgba(244, 241, 235, 0.97) 0%,
        rgba(244, 241, 235, 0.90) 50%,
        rgba(244, 241, 235, 0) 100%
      );
      text-align: center;
    }
    .top-overlay h1 {
      font-size: 62px;
      font-weight: 900;
      color: #1c1917;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }
    .top-overlay h1 .accent { color: #7c3aed; font-style: italic; }
    .footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 48px;
      background: linear-gradient(to bottom,
        rgba(244, 241, 235, 0) 0%,
        rgba(244, 241, 235, 0.9) 50%,
        rgba(244, 241, 235, 1) 100%
      );
    }
    .footer-stat { font-size: 17px; font-weight: 600; color: #78716c; }
    .footer-url { font-size: 19px; font-weight: 800; color: #7c3aed; }
  </style>
</head>
<body>
  <div class="pin">
    <img src="shower-curtain-items.png" alt="Illustration of non toxic bath goods: a folded fabric shower curtain, a teak wood bath mat, a natural loofah, and a cotton towel on marble">
    <div class="top-overlay">
      <h1>That New Shower Curtain<br>Smell? <span class="accent">108 Chemicals</span></h1>
    </div>
    <div class="footer">
      <span class="footer-stat">Hemp, cotton, and linen fix it for good.</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body>
</html>

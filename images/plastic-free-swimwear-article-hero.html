<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Plastic Free Swimwear Article Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #d6d3d1; display: flex; justify-content: center; padding: 2rem; font-family: 'Inter', -apple-system, sans-serif; }
    .pin {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: #fbfcf6;
    }
    .pin > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .top-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 70px 56px 140px;
      background: linear-gradient(to bottom,
        rgba(251, 252, 246, 0.98) 0%,
        rgba(251, 252, 246, 0.92) 52%,
        rgba(251, 252, 246, 0) 100%
      );
      text-align: center;
    }
    .headline-tag {
      display: inline-block;
      font-size: 32px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #fff;
      background: #7c3aed;
      padding: 16px 36px;
      border-radius: 100px;
      margin-bottom: 30px;
    }
    .top-overlay h1 {
      font-size: 100px;
      font-weight: 900;
      color: #1c1917;
      line-height: 0.98;
      letter-spacing: -0.04em;
    }
    .top-overlay h1 .accent { color: #7c3aed; font-style: italic; }
    .footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 48px;
      background: linear-gradient(to bottom,
        rgba(251, 252, 246, 0) 0%,
        rgba(251, 252, 246, 0.92) 52%,
        rgba(251, 252, 246, 1) 100%
      );
    }
    .footer-stat { font-size: 32px; font-weight: 700; color: #44403c; }
    .footer-url { font-size: 32px; font-weight: 900; color: #7c3aed; }
  </style>
</head>
<body>
  <div class="pin">
    <img src="plastic-free-swimwear.png" alt="Black and white pencil illustration of a bikini and a pair of board shorts">
    <div class="top-overlay">
      <div class="headline-tag">2026 Buying Guide</div>
      <h1>Plastic Free<br>Swimwear,<br><span class="accent">Honestly Ranked</span></h1>
    </div>
    <div class="footer">
      <span class="footer-stat">Ranked by plastic content</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Oral Care Email Hero</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #d6d3d1; display: flex; justify-content: center; padding: 2rem; font-family: 'Inter', -apple-system, sans-serif; }
    .pin {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: #fafaf9;
    }
    .pin > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 65%;
      display: block;
    }
    .top-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 64px 50px 110px;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0.98) 0%,
        rgba(250, 250, 249, 0.92) 55%,
        rgba(250, 250, 249, 0) 100%
      );
      text-align: center;
    }
    .top-overlay h1 {
      font-size: 96px;
      font-weight: 900;
      color: #1c1917;
      line-height: 1.0;
      letter-spacing: -0.035em;
    }
    .top-overlay h1 .accent { color: #7c3aed; font-style: italic; }
    .footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 48px;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0) 0%,
        rgba(250, 250, 249, 0.92) 55%,
        rgba(250, 250, 249, 1) 100%
      );
    }
    .footer-stat { font-size: 32px; font-weight: 700; color: #44403c; }
    .footer-url { font-size: 32px; font-weight: 900; color: #7c3aed; }
  </style>
</head>
<body>
  <div class="pin">
    <img src="oral-care-hero-bg.png" alt="Pencil sketch of bamboo toothbrushes in a cup">
    <div class="top-overlay">
      <h1>The <span class="accent">Low Tox</span><br>Mouth</h1>
    </div>
    <div class="footer">
      <span class="footer-stat">3 swaps: brush, floss, paste</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>6 Swaps to Keep Plastic Out of Baby Food — Pinterest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #d6d3d1;
      display: flex;
      justify-content: center;
      padding: 2rem;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .pin {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
    }

    .pin > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .top-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 44px 40px 80px;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0.95) 0%,
        rgba(250, 250, 249, 0.85) 60%,
        rgba(250, 250, 249, 0) 100%
      );
      text-align: center;
    }

    .headline-tag {
      display: inline-block;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #7c3aed;
      background: #ede9fe;
      padding: 8px 22px;
      border-radius: 100px;
      margin-bottom: 16px;
    }

    .top-overlay h1 {
      font-size: 52px;
      font-weight: 900;
      color: #1c1917;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .badge {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #7c3aed;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 2px 12px rgba(124, 58, 237, 0.5),
        0 0 0 3px rgba(255, 255, 255, 0.95);
      z-index: 3;
    }

    .badge-1 { left: 8%; top: 30%; }
    .badge-2 { left: 35%; top: 25%; }
    .badge-3 { left: 50%; top: 40%; }
    .badge-4 { left: 35%; top: 55%; }
    .badge-5 { left: 70%; top: 50%; }
    .badge-6 { left: 25%; top: 68%; }

    .footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 44px;
      background: linear-gradient(to bottom,
        rgba(250, 250, 249, 0) 0%,
        rgba(250, 250, 249, 0.9) 40%,
        rgba(250, 250, 249, 1) 100%
      );
    }

    .footer-stat {
      font-size: 15px;
      font-weight: 600;
      color: #78716c;
    }

    .footer-url {
      font-size: 17px;
      font-weight: 800;
      color: #7c3aed;
    }
  </style>
</head>
<body>
  <div class="pin">
    <img src="babyfood.png" alt="Baby food preparation with glass containers">

    <div class="top-overlay">
      <div class="headline-tag">Baby Food Guide</div>
      <h1>6 Swaps to Keep Plastic<br>Out of Baby Food</h1>
    </div>

    <div class="badge badge-1">1</div>
    <div class="badge badge-2">2</div>
    <div class="badge badge-3">3</div>
    <div class="badge badge-4">4</div>
    <div class="badge badge-5">5</div>
    <div class="badge badge-6">6</div>

    <div class="footer">
      <span class="footer-stat">Babies ingest 10x more microplastics than adults.</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body>
</html>

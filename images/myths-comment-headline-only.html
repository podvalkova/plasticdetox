<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Comment MYTHS — Infographic</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #d6d3d1;
      display: flex;
      justify-content: center;
      padding: 2rem;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    .pin {
      width: 1080px;
      height: 1350px;
      background: #fafaf9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 64px 72px;
    }
    .headline-tag {
      display: inline-block;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #7c3aed;
      background: #ede9fe;
      padding: 10px 28px;
      border-radius: 100px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 56px;
      font-weight: 900;
      color: #1c1917;
      line-height: 1.08;
      letter-spacing: -0.03em;
      text-align: center;
      margin-bottom: 44px;
    }
    .divider {
      width: 60px;
      height: 4px;
      background: #7c3aed;
      border-radius: 2px;
      margin-bottom: 56px;
    }
    .cta-card {
      width: 100%;
      background: #f5f3ff;
      border: 3px solid #7c3aed;
      border-radius: 24px;
      padding: 64px 52px;
      text-align: center;
    }
    .cta-card .cta-keyword {
      font-size: 72px;
      font-weight: 900;
      color: #7c3aed;
      letter-spacing: 0.04em;
      margin-bottom: 20px;
    }
    .cta-card .cta-sub {
      font-size: 34px;
      font-weight: 600;
      color: #44403c;
      line-height: 1.4;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 56px;
      padding-top: 20px;
      border-top: 2px solid #e7e5e4;
    }
    .footer-stat {
      font-size: 18px;
      font-weight: 600;
      color: #78716c;
    }
    .footer-url {
      font-size: 20px;
      font-weight: 800;
      color: #7c3aed;
    }
  </style>
</head>
<body>
  <div class="pin">
    <div class="headline-tag">Myth Busting</div>
    <h1>Low Tox Myths,<br>Debunked</h1>
    <div class="divider"></div>

    <div class="cta-card">
      <div class="cta-keyword">Comment MYTHS</div>
      <div class="cta-sub">to get the full list</div>
    </div>

    <div class="footer">
      <span class="footer-stat">27 claims ranked by actual evidence</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Essential Oxygen BR</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #d6d3d1;
      display: flex;
      justify-content: center;
      padding: 2rem;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    .pin {
      width: 1080px;
      height: 1920px;
      background: #ede9fe;
      display: flex;
      flex-direction: column;
      padding: 80px 70px 70px;
      position: relative;
      overflow: hidden;
    }
    .pin::before {
      content: "";
      position: absolute;
      top: -200px;
      right: -200px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 181, 253, 0.6) 0%, rgba(237, 233, 254, 0) 70%);
      pointer-events: none;
    }
    .pin::after {
      content: "";
      position: absolute;
      bottom: -250px;
      left: -250px;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 181, 253, 0.5) 0%, rgba(237, 233, 254, 0) 70%);
      pointer-events: none;
    }
    .frame-label {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.32em;
      color: #7c3aed;
      text-transform: uppercase;
      z-index: 5;
      margin-bottom: 32px;
      position: relative;
    }
    .header {
      text-align: center;
      position: relative;
      z-index: 2;
      margin-bottom: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tag {
      display: inline-block;
      font-size: 36px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #ffffff;
      background: #7c3aed;
      
      padding: 16px 44px;
      border-radius: 100px;
      margin-bottom: 28px;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.45);
    }
    .product-img {
      width: 480px;
      height: 480px;
      background: #ffffff;
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 28px;
      box-shadow: 0 16px 40px rgba(76, 29, 149, 0.18);
      
    }
    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 24px;
    }
    h1 {
      font-size: 78px;
      font-weight: 900;
      color: #1c1917;
      line-height: 0.96;
      letter-spacing: -0.04em;
    }
    h1 .accent {
      color: #7c3aed;
      font-style: italic;
    }
    .verdict-rows {
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
      z-index: 2;
    }
    .row {
      background: #ffffff;
      border-radius: 26px;
      padding: 28px 36px;
      box-shadow: 0 10px 32px rgba(76, 29, 149, 0.12);
      border-left: 16px solid;
      
    }
    .row.good { border-left-color: #16a34a; }
    .row.bad { border-left-color: #dc2626; }
    .row-label {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .row.good .row-label { color: #16a34a; }
    .row.bad .row-label { color: #dc2626; }
    .row-text {
      font-size: 34px;
      font-weight: 600;
      color: #1c1917;
      line-height: 1.3;
      letter-spacing: -0.005em;
    }
    .winner-banner {
      margin-top: 32px;
      background: linear-gradient(135deg, #facc15 0%, #f59e0b 100%);
      color: #1c1917;
      border-radius: 26px;
      padding: 32px 40px;
      text-align: center;
      position: relative;
      z-index: 2;
      box-shadow: 0 16px 40px rgba(250, 204, 21, 0.35);
    }
    .winner-label {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .winner-text {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: auto;
      padding-top: 32px;
      border-top: 2px solid rgba(124, 58, 237, 0.25);
      position: relative;
      z-index: 2;
    }
    .footer-stat {
      font-size: 32px;
      font-weight: 700;
      color: #57534e;
    }
    .footer-url {
      font-size: 36px;
      font-weight: 900;
      color: #7c3aed;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="pin">
    <div class="frame-label">6 of 7</div>

    <div class="header">
      <div class="tag">Contender</div>
      <div class="product-img"><img src="_tmp-essentialoxygen.jpg" alt="Essential Oxygen BR"></div>
      <h1>Essential Oxygen BR</h1>
    </div>

    <div class="verdict-rows">
      <div class="row good">
        <div class="row-label">Good</div>
        <div class="row-text">Non detect for heavy metals in independent testing. USDA Certified Organic.</div>
      </div>
      <div class="row bad">
        <div class="row-label">Bad</div>
        <div class="row-text">Hydrogen peroxide base linked to microbiome disruption and brown tongue with daily use.</div>
      </div>
    </div>

    

    <div class="footer">
      <span class="footer-stat">Toothpaste showdown</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Non Toxic Pick — Steel Water Bottle</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      src: url(inter-latin.woff2) format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #d6d3d1; display: flex; justify-content: center; padding: 2rem; font-family: 'Inter', -apple-system, sans-serif; }
    .pin {
      width: 828px;
      height: 606px;
      background: #ede9fe;
      border: 6px solid #5b21b6;
      display: flex;
      flex-direction: column;
      padding: 56px 56px 50px;
    }
    h1 {
      font-size: 88px;
      font-weight: 900;
      color: #1c1917;
      line-height: 1.0;
      letter-spacing: -0.035em;
      margin-bottom: 32px;
    }
    h1 .accent { color: #7c3aed; font-style: italic; }
    .brands {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 36px;
    }
    .brand {
      background: #fff;
      color: #5b21b6;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.01em;
      padding: 14px 28px;
      border-radius: 14px;
    }
    .why-label {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #7c3aed;
      margin-bottom: 14px;
    }
    .why {
      font-size: 38px;
      font-weight: 600;
      color: #1c1917;
      line-height: 1.3;
      letter-spacing: -0.015em;
    }
  </style>
</head>
<body>
  <div class="pin">
    <h1><span class="accent">Steel</span> Water<br>Bottle</h1>

    <div class="brands">
      <div class="brand">Klean Kanteen</div>
      <div class="brand">Pura Kiki</div>
    </div>

    <div class="why-label">Why it matters</div>
    <div class="why">18/8 stainless interior. No plastic linings, no microplastic shedding into milk or water.</div>
  </div>
</body>
</html>

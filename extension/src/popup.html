<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plastic Detox Brand Check</title>
  <style>
    :root {
      --good: #16a34a; --careful: #b45309; --skip: #dc2626;
      --text: #1c1917; --muted: #78716c; --line: #e7e5e4;
    }
    * { box-sizing: border-box; }
    body {
      width: 300px; margin: 0; padding: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text); background: #fff; font-size: 13px;
    }
    header { padding: 15px 16px 13px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
    .sub { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); }
    .stats { display: flex; gap: 8px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .stat { flex: 1; }
    .stat b { display: block; font-size: 17px; font-weight: 700; line-height: 1.2; }
    .stat span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .legend { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .legend-title { font-size: 10px; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    label.toggle { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; }
    label.toggle input { margin: 2px 0 0; flex: 0 0 auto; }
    .toggle-text b { display: block; font-size: 12.5px; font-weight: 600; }
    .toggle-text span { font-size: 11px; color: var(--muted); line-height: 1.45; display: block; margin-top: 2px; }
    button {
      width: 100%; padding: 8px; margin-top: 10px; border: 1px solid var(--line);
      border-radius: 7px; background: #fafaf9; font-family: inherit; font-size: 12px;
      font-weight: 600; color: var(--text); cursor: pointer;
    }
    button:hover { background: #f5f5f4; }
    button:disabled { opacity: .55; cursor: default; }
    footer { padding: 11px 16px 13px; }
    footer a { color: #0f766e; font-weight: 600; text-decoration: none; font-size: 12px; }
    footer a:hover { text-decoration: underline; }
    .note { margin: 8px 0 0; font-size: 10.5px; color: var(--muted); line-height: 1.5; }
    .updated { font-size: 10.5px; color: var(--muted); margin-top: 9px; }
  </style>
</head>
<body>
  <header>
    <h1>Plastic Detox Brand Check</h1>
    <p class="sub">Verdicts on Amazon, as you shop.</p>
  </header>

  <div class="stats">
    <div class="stat"><b id="brandCount">—</b><span>Brands</span></div>
    <div class="stat"><b id="asinCount">—</b><span>Products</span></div>
  </div>

  <div class="legend">
    <div class="legend-title">Every brand vetted on</div>
    <div class="row"><span class="dot" style="background:var(--good)"></span>Formula</div>
    <div class="row"><span class="dot" style="background:var(--good)"></span>Packaging</div>
    <div class="row"><span class="dot" style="background:var(--careful)"></span>Recalls &amp; lawsuits</div>
    <div class="row"><span class="dot" style="background:var(--skip)"></span>Independent tests</div>
  </div>

  <section>
    <label class="toggle">
      <input type="checkbox" id="logMisses">
      <span class="toggle-text">
        <b>Help us cover more brands</b>
        <span>When a product page shows a brand we have not reviewed, send us the
        brand name so we know what to research next. Brand name only, never your
        browsing history.</span>
      </span>
    </label>
    <button id="refresh">Refresh brand data</button>
    <div class="updated" id="updated"></div>
  </section>

  <footer>
    <a href="https://plasticdetox.org/brand-check.html" target="_blank" rel="noopener">Search all brands →</a>
    <p class="note">This extension contains no affiliate links and never changes
    where your purchase is credited.</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>

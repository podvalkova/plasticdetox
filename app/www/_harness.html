<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="./css/app.css">
<style>
  body { background:#c9c6bd; margin:0; padding:24px; }
  #out { display:flex; gap:24px; align-items:flex-start; }
  .ph { width:393px; background:var(--bg); border-radius:34px; overflow:hidden;
        box-shadow:0 18px 50px rgba(0,0,0,.25); position:relative; }
  .ph > h6 { margin:0; padding:8px 14px; font:700 11px Inter,sans-serif; letter-spacing:.14em;
             text-transform:uppercase; color:#fff; background:#12130F; }
  .ph > .view { padding:16px 18px 28px; min-height:700px; }
</style>
<div id="out"></div>
<script type="module">
import * as data from "./js/data.js";
import * as screens from "./js/screens.js";
import { roomName } from "./js/detox-content.js";
await data.load();
const phases = data.planPhases();
const done = new Set(phases[0].steps.slice(0, 4).map(s => s.id));
const out = document.getElementById("out");
const frame = (label) => {
  const ph = document.createElement("div"); ph.className = "ph";
  const h = document.createElement("h6"); h.textContent = label; ph.appendChild(h);
  const v = document.createElement("div"); v.className = "view"; ph.appendChild(v);
  out.appendChild(ph); return v;
};
screens.detox(frame("detox"), { phases, done, seen: new Set(), room: "0",
  onRoom(){}, onStep(){}, onKids(){}, onCleared(){} });
const step = phases[0].steps.find(s => !done.has(s.id));
screens.detoxStep(frame("step detail"), { phase: phases[0], step, isDone:false, isSeen:false,
  onDone(){}, onUndo(){}, onLater(){}, onOpen(){} });
const all = phases.reduce((n,p)=>n+p.steps.length,0);
screens.detoxReward(frame("reward"), { ticked: done.size + 1, all, cleared: step.swap,
  roomLabel: `${roomName(phases[0])} · ${done.size+1} of ${phases[0].steps.length}`,
  nextStep: phases[0].steps[5], onNext(){}, onClose(){} });
const rows = [...done].map(id => {
  for (const ph of phases) { const h = ph.steps.find(s=>s.id===id); if (h) return { id, title: h.swap, meta: roomName(ph) }; }
});
const cf = frame("cleared sheet");
cf.style.position = "relative"; cf.style.minHeight = "700px";
screens.detoxCleared(cf, { rows, onUndo(){}, onClose(){} });
cf.querySelectorAll(".sheet,.sheet-veil").forEach(e => e.style.position = "absolute");
// the product detail, on a brand with all four checks and lab rows
const idx = data.getIndex();
const list = idx.brands || idx;
const pick = list.find(b => b.stance === "good" && b.fronts && (b.ext||{}).testingResults?.length)
          || list.find(b => b.stance === "good" && b.fronts)
          || list[0];
console.log("detail brand:", pick && pick.brand);
screens.result(frame("product detail"), {
  index: idx, match: { brand: pick, via: "picked" }, scan: null, product: null,
  query: pick.brand, productNamed: false,
  onOpen(){}, onPick(){}, onProduct(){}, onSave(){}, isSaved: () => false, onRequest(){},
});
const idx2 = data.getIndex();
screens.shopIndex(frame("shop"), { index: idx2, room: "", onRoom(){}, onProduct(){}, onOpen(){}, onCategory(){} });
screens.learn(frame("learn"), { articles: data.allArticles(), query: "", onQuery(){}, onOpen(){} });
screens.saved(frame("saved"), { items: [], index: idx2, onProduct(){}, onOpen(){}, onShop(){} });
document.title = "ready";
</script>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><title>Slide 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #d6d3d1;
    display: flex;
    justify-content: center;
    padding: 2rem;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .pin {
    width: 1080px;
    height: 1350px;
    background: #fafaf9;
    position: relative;
    overflow: hidden;
  }

    .pin {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 60px 30px;
      background: #fafaf9;
    }
    .pin::before {
      content: "";
      position: absolute;
      top: -180px; right: -180px;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196,181,253,0.5) 0%, rgba(250,250,249,0) 70%);
      pointer-events: none;
    }
    .pin::after {
      content: "";
      position: absolute;
      bottom: -200px; left: -180px;
      width: 700px; height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196,181,253,0.4) 0%, rgba(250,250,249,0) 70%);
      pointer-events: none;
    }
    .header {
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .headline-tag {
      display: inline-block;
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: #fff;
      background: #7c3aed;
      padding: 16px 36px;
      border-radius: 100px;
      margin-bottom: 36px;
    }
    h1 {
      font-size: 110px;
      font-weight: 900;
      color: #1c1917;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }
    h1 .accent { color: #7c3aed; font-style: italic; }
    .sub {
      margin-top: 36px;
      font-size: 38px;
      font-weight: 700;
      color: #44403c;
      letter-spacing: -0.01em;
    }
    .footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 48px;
      z-index: 2;
    }
    .footer-stat { font-size: 32px; font-weight: 700; color: #57534e; }
    .footer-url { font-size: 32px; font-weight: 900; color: #7c3aed; }
  </style>
  <div class="pin">
    <div class="header">
      <div class="headline-tag">Your turn</div>
      <h1>What activewear are <span class="accent">you</span> wearing?</h1>
      <div class="sub">Drop the brand in the comments. We'll screen it.</div>
    </div>
    <div class="footer">
      <span class="footer-stat">Free brand check</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><title>Slide 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #d6d3d1;
    display: flex;
    justify-content: center;
    padding: 2rem;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .pin {
    width: 1080px;
    height: 1350px;
    background: #fafaf9;
    position: relative;
    overflow: hidden;
  }
  .blob-tr::before {
    content: "";
    position: absolute;
    top: -180px; right: -180px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,181,253,0.5) 0%, rgba(250,250,249,0) 70%);
    pointer-events: none;
  }
  .blob-bl::after {
    content: "";
    position: absolute;
    bottom: -200px; left: -180px;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,181,253,0.4) 0%, rgba(250,250,249,0) 70%);
    pointer-events: none;
  }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 22px;
    border-top: 2px solid rgba(124,58,237,0.18);
    margin-top: 24px;
    position: relative;
    z-index: 2;
  }
  .footer-stat { font-size: 32px; font-weight: 700; color: #57534e; }
  .footer-url { font-size: 32px; font-weight: 900; color: #7c3aed; }
  .tag-pill {
    display: inline-block;
    font-size: 30px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #fff;
    background: #1c1917;
    padding: 14px 30px;
    border-radius: 100px;
  }

    .pin {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 70px 30px;
    }
    .header { text-align: center; position: relative; z-index: 2; }
    .tag-pill { background: #7c3aed; margin-bottom: 40px; }
    h1 {
      font-size: 96px;
      font-weight: 900;
      color: #1c1917;
      line-height: 0.99;
      letter-spacing: -0.04em;
    }
    h1 .accent { color: #7c3aed; font-style: italic; }
    .sub {
      margin-top: 40px;
      font-size: 40px;
      font-weight: 700;
      color: #44403c;
      letter-spacing: -0.01em;
      max-width: 860px;
      line-height: 1.28;
    }
    .footer { position: absolute; bottom: 0; left: 0; right: 0; padding: 32px 56px; border-top: none; margin: 0; }
  </style>
  <div class="pin blob-tr blob-bl">
    <div class="header">
      <div class="tag-pill">Read the full guide</div>
      <h1>Signal, not <span class="accent">panic</span>.</h1>
      <div class="sub">The science, the honest caveats, and every swap ranked by what actually moves the needle.</div>
    </div>
    <div class="footer">
      <span class="footer-stat">Full guide, link in bio</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div></body></html>

<!DOCTYPE html>

<body>
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #d6d3d1;
    display: flex;
    justify-content: center;
    padding: 2rem;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .pin {
    width: 1080px;
    height: 1350px;
    background: #fafaf9;
    position: relative;
    overflow: hidden;
  }
  .blob-tr::before {
    content: "";
    position: absolute;
    top: -180px; right: -180px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,181,253,0.5) 0%, rgba(250,250,249,0) 70%);
    pointer-events: none;
  }
  .blob-bl::after {
    content: "";
    position: absolute;
    bottom: -200px; left: -180px;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,181,253,0.4) 0%, rgba(250,250,249,0) 70%);
    pointer-events: none;
  }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 22px;
    border-top: 2px solid rgba(124,58,237,0.18);
    margin-top: 24px;
    position: relative;
    z-index: 2;
  }
  .footer-stat { font-size: 32px; font-weight: 700; color: #57534e; }
  .footer-url { font-size: 32px; font-weight: 900; color: #7c3aed; }
  .tag-pill {
    display: inline-block;
    font-size: 30px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #fff;
    background: #1c1917;
    padding: 14px 30px;
    border-radius: 100px;
  }

    .pin { display: flex; flex-direction: column; padding: 70px 56px 28px; }
    .header { text-align: center; }
    .tag-pill { background: #dc2626; margin-bottom: 26px; }
    h1 {
      font-size: 88px;
      font-weight: 900;
      color: #1c1917;
      line-height: 0.99;
      letter-spacing: -0.04em;
      margin-bottom: 40px;
    }
    h1 .accent { color: #dc2626; font-style: italic; }
    .items { display: flex; flex-direction: column; gap: 22px; flex: 1; min-height: 0; }
    .skip {
      display: flex; align-items: center; gap: 28px;
      background: #fff; border: 3px solid #fca5a5; border-radius: 24px;

    .keyline {
      margin-top: 24px;
      background: #7c3aed; color: #fff; border-radius: 26px;
      padding: 40px 44px; font-size: 42px; font-weight: 800; text-align: center; line-height: 1.16; letter-spacing: -0.02em;
    }

  <div class="pin">

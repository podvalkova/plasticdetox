<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><title>Reel Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #d6d3d1;
    display: flex;
    justify-content: center;
    padding: 2rem;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .pin {
    width: 1080px;
    height: 1920px;
    background: #fafaf9;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 120px 80px;
  }
  .pin::before {
    content: "";
    position: absolute;
    top: -220px; right: -220px;
    width: 720px; height: 720px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,181,253,0.55) 0%, rgba(250,250,249,0) 70%);
    pointer-events: none;
  }
  .pin::after {
    content: "";
    position: absolute;
    bottom: -260px; left: -220px;
    width: 820px; height: 820px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,181,253,0.45) 0%, rgba(250,250,249,0) 70%);
    pointer-events: none;
  }
  .header { text-align: center; position: relative; z-index: 2; }
  .tag-pill {
    display: inline-block;
    font-size: 34px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: #fff;
    background: #7c3aed;
    padding: 18px 40px;
    border-radius: 100px;
    margin-bottom: 56px;
  }
  h1 {
    font-size: 138px;
    font-weight: 900;
    color: #1c1917;
    line-height: 0.96;
    letter-spacing: -0.045em;
  }
  h1 .accent { color: #7c3aed; font-style: italic; }
  .sub {
    margin-top: 52px;
    font-size: 46px;
    font-weight: 700;
    color: #44403c;
    letter-spacing: -0.01em;
    max-width: 820px;
    line-height: 1.26;
  }
  .footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 56px 72px;
    z-index: 2;
  }
  .footer-stat { font-size: 36px; font-weight: 700; color: #57534e; }
  .footer-url { font-size: 36px; font-weight: 900; color: #7c3aed; }
  </style>
  <div class="pin">
    <div class="header">
      <div class="tag-pill">Women's Edition</div>
      <h1>7 best swimsuits with <span class="accent">way less plastic</span></h1>
      <div class="sub">Ranked by actual plastic content, not greenwashing.</div>
    </div>
    <div class="footer">
      <span class="footer-stat">Save this for summer</span>
      <span class="footer-url">plasticdetox.org</span>
    </div>
  </div>
</body></html>
